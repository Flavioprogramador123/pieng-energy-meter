<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIENG Energy — Acompanhar</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">PIENG Energy</div>
    <p class="tag">Painel do cliente · somente leitura</p>
    <div id="status" class="status">Carregando…</div>
  </header>

  <main>
    <section class="kpis">
      <article>
        <h2>Tensão L1</h2>
        <p id="kpiV" class="kpi">—</p>
      </article>
      <article>
        <h2>Potência</h2>
        <p id="kpiP" class="kpi">—</p>
      </article>
      <article>
        <h2>Energia</h2>
        <p id="kpiE" class="kpi">—</p>
      </article>
    </section>

    <section class="chart-wrap">
      <h2>Potência (24 h)</h2>
      <canvas id="chartPower" height="120"></canvas>
    </section>

    <p class="note" id="help"></p>
    <p class="note">
      A coleta roda no servidor PIENG (a cada 3 min). Este site só exibe.
    </p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
