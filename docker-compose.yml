# Postgres em DOCKER (caminho futuro / mini PC). Mantido de proposito.
# Em 2026-09-09 o TESTE no escritorio usa Postgres NATIVO (servico Windows
# postgresql-x64-17) com data dir em:
#   K:\storage\postgres\energy_meter\pgdata
# O volume Docker fica em pasta SEPARADA para nao colidir com o nativo:
#   K:\storage\postgres\energy_meter_docker
# Nao apagar este arquivo — sera reutilizado quando Docker/mini PC estiver ok.
# Para mover de host, prefira `pg_dump`/`pg_restore` a copiar a pasta do volume.
services:
  postgres:
    image: postgres:16
    container_name: energy_meter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy_meter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy_meter_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-energy_meter}
    ports:
      # Nativo ja usa 5432 nesta maquina — ao testar Docker, mude para 5433
      - "127.0.0.1:5433:5432"
    volumes:
      - K:/storage/postgres/energy_meter_docker:/var/lib/postgresql/data
